<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undelix</title>
<meta name="description" content="Undelix – recover deleted photos, videos and files that are still on your Android phone.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root { --brand: #7C5CFF; --accent: #B9A6FF; --text: #EEF0FF; --muted: #8C93B8; --bg: #0A0D1A; }
  @media (prefers-color-scheme: light) { :root { --accent: #5B3FE0; --text: #161A33; --muted: #5A6188; --bg: #F4F3FF; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--text);
    background: radial-gradient(circle at 70% 0%, rgba(124,92,255,.28), transparent 60%), var(--bg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 24px 16px; }
  main { text-align: center; max-width: 440px; }
  .logo { width: 104px; height: 104px; border-radius: 26px; margin: 0 auto 20px; display: block;
    box-shadow: 0 12px 40px rgba(124,92,255,.35); }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: .5px; }
  .tag { margin: 0 0 6px; color: var(--muted); }
  .mono { margin: 0 0 28px; color: var(--muted); font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.5px; }
  a { color: var(--accent); font-weight: 600; }
  nav { display: flex; gap: 24px; justify-content: center; font-size: 15px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="">
  <h1>Undelix</h1>
  <p class="tag">Find and recover deleted photos, videos and files that are still on your Android phone.</p>
  <p class="mono">PHOTO · VIDEO · FILE RECOVERY</p>
  <nav>
    <a href="privacy/">Privacy Policy</a>
    <a href="mailto:zzz13221126@163.com">Contact</a>
  </nav>
</main>
</body>
</html>
